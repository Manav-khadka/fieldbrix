name: Deploy Applications

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options: [prod]
      confirm:
        description: I reviewed the umbrella commit and want to deploy it
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: application-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            fieldbrix-backend/pnpm-lock.yaml
            fieldbrix-frontend/pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - name: Configure short-lived deployment credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Initialize Terraform outputs
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform init -input=false
      - name: Build, deploy, and verify
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          FIELDBRIX_BACKEND_DIR: ${{ github.workspace }}/fieldbrix-backend
          FIELDBRIX_FRONTEND_DIR: ${{ github.workspace }}/fieldbrix-frontend
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
          SENTRY_BACKEND_PROJECT: ${{ vars.SENTRY_BACKEND_PROJECT }}
          WEB_SENTRY_DSN: ${{ secrets.PROD_WEB_SENTRY_DSN }}
          BACKEND_SENTRY_DSN: ${{ secrets.PROD_BACKEND_SENTRY_DSN }}
        run: ./terraform/scripts/deploy-apps.sh "${{ inputs.environment }}"
      - name: Record deployment evidence
        if: success()
        run: |
          jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg umbrellaCommit "${{ github.sha }}" \
            --arg backendVersion "$(jq -r .version fieldbrix-backend/package.json)" \
            --arg frontendVersion "$(jq -r .version fieldbrix-frontend/package.json)" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{environment: $environment, umbrellaCommit: $umbrellaCommit, backendVersion: $backendVersion, frontendVersion: $frontendVersion, deployedAt: $deployedAt}' \
            > deployment-manifest.json
          {
            echo "## FieldBrix deployment"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Umbrella commit: \`${{ github.sha }}\`"
            echo "- Backend: tracked in umbrella commit"
            echo "- Frontend: tracked in umbrella commit"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload deployment manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-${{ github.run_id }}
          path: deployment-manifest.json
          if-no-files-found: error
