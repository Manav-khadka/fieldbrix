name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - name: Validate without remote state
        run: ./terraform/scripts/validate.sh prod
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Write non-secret plan inputs
        working-directory: terraform/environments/prod
        env:
          AMI_ID: ${{ secrets.PROD_AMI_ID }}
          ALERT_EMAIL: ${{ secrets.PROD_ALERT_EMAIL }}
          DATABASE_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          BACKEND_SENTRY_DSN: ${{ secrets.PROD_BACKEND_SENTRY_DSN }}
          TF_VAR_database_password: ${{ secrets.PROD_DB_PASSWORD }}
          TF_VAR_backend_sentry_dsn: ${{ secrets.PROD_BACKEND_SENTRY_DSN }}
        run: |
          test -n "${AMI_ID}"
          test -n "${ALERT_EMAIL}"
          test -n "${DATABASE_PASSWORD}"
          test -n "${BACKEND_SENTRY_DSN}"
          cp terraform.tfvars.example terraform.tfvars
          sed -i "s/ami-REPLACE_WITH_CURRENT_AMI/${AMI_ID}/" terraform.tfvars
          sed -i "s/ops@example.com/${ALERT_EMAIL}/" terraform.tfvars
      - name: Initialize remote state
        working-directory: terraform/environments/prod
        run: terraform init -input=false
      - name: Create reviewed plan
        working-directory: terraform/environments/prod
        run: terraform plan -input=false -no-color
