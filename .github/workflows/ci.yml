name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Backend
        run: |
          pnpm --dir fieldbrix-backend install --frozen-lockfile
          pnpm --dir fieldbrix-backend exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
          pnpm --dir fieldbrix-backend exec tsc --noEmit
          pnpm --dir fieldbrix-backend test --runInBand
          pnpm --dir fieldbrix-backend test:e2e --runInBand
          pnpm --dir fieldbrix-backend build

      - name: Frontend
        run: |
          pnpm --dir fieldbrix-frontend install --frozen-lockfile
          pnpm --dir fieldbrix-frontend lint
          pnpm --dir fieldbrix-frontend build

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform
        run: ./terraform/scripts/validate.sh prod
